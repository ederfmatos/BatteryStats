name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK debug
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # O APK debug é assinado com a debug key gerada automaticamente pelo AGP.
      # É o suficiente para sideload; não há keystore de release neste repositório.
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: batterystats-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar relatório de testes em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-${{ steps.sha.outputs.short }}
          path: app/build/reports/tests/
          retention-days: 30
