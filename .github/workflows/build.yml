name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Versão
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="0.0.0-$SHORT_SHA"
          fi
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION_NAME+$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 ausente. Sem ele o APK de release não pode ser assinado
            com a chave que o app instalado espera."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Testes e APK de release
        env:
          BUILD_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Apagar o keystore do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Gerar latest.json
        id: manifest
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          CHANGELOG=$(git log -1 --pretty=%B | head -20)
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --argjson minSdk 26 \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/app-release.apk" \
            --arg sha256 "$SHA" \
            --argjson sizeBytes "$SIZE" \
            --argjson publishedAtMs "$(date +%s%3N)" \
            --arg changelog "$CHANGELOG" \
            --argjson mandatory false \
            '{versionCode:$versionCode, versionName:$versionName, minSdk:$minSdk, apkUrl:$apkUrl,
              sha256:$sha256, sizeBytes:$sizeBytes, publishedAtMs:$publishedAtMs,
              changelog:$changelog, mandatory:$mandatory}' > latest.json
          cat latest.json
          cp app/config.json config.json
          {
            echo "$CHANGELOG"
            echo
            echo "SHA-256 do APK: \`$SHA\`"
          } > release-notes.md

      # O artifact do workflow leva o SHA no nome; o asset da Release tem nome FIXO,
      # senão o link estável releases/latest/download/app-release.apk quebraria.
      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: batterystats-${{ steps.version.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publicar relatório de testes em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-${{ steps.version.outputs.short_sha }}
          path: app/build/reports/tests/
          retention-days: 30

      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/app-release.apk
            latest.json
            config.json
